<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KyuuCode · Beranda</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    /* reset dan global sama seperti sebelumnya */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0d15;
      color: #e8edf5;
      min-height: 100vh;
    }
    a { text-decoration:none; color:inherit; }
    button { cursor:pointer; font-family:inherit; border:none; outline:none; }
    input, textarea, select { font-family:inherit; outline:none; border:none; }
    .container { max-width:1280px; margin:0 auto; padding:0 24px; }
    .flex { display:flex; align-items:center; justify-content:space-between; }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color:#fff; padding:10px 28px; border-radius:40px; font-weight:600; font-size:0.95rem;
      transition:all 0.3s; box-shadow:0 4px 20px rgba(79,70,229,0.3);
      display:inline-flex; align-items:center; gap:8px;
    }
    .btn-primary:hover { transform:translateY(-2px) scale(1.02); box-shadow:0 8px 30px rgba(79,70,229,0.5); }
    .btn-secondary {
      background:rgba(255,255,255,0.06); backdrop-filter:blur(8px);
      color:#e8edf5; padding:10px 28px; border-radius:40px; font-weight:600;
      border:1px solid rgba(255,255,255,0.08); transition:all 0.3s;
      display:inline-flex; align-items:center; gap:8px;
    }
    .btn-secondary:hover { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.2); transform:translateY(-2px); }
    .navbar {
      padding:18px 0; border-bottom:1px solid rgba(255,255,255,0.04);
      background:rgba(11,13,21,0.8); backdrop-filter:blur(16px);
      position:sticky; top:0; z-index:100;
    }
    .navbar .container { display:flex; align-items:center; justify-content:space-between; }
    .logo { font-size:1.6rem; font-weight:800; background:linear-gradient(135deg, #a78bfa, #4f46e5); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-0.5px; }
    .logo i { -webkit-text-fill-color:initial; color:#a78bfa; margin-right:6px; }
    .nav-links { display:flex; align-items:center; gap:28px; list-style:none; }
    .nav-links a { font-weight:500; font-size:0.95rem; color:#a0a9c4; transition:color 0.3s; }
    .nav-links a:hover { color:#e8edf5; }
    .nav-links a.active { color:#e8edf5; position:relative; }
    .nav-links a.active::after { content:''; position:absolute; bottom:-6px; left:0; width:100%; height:2px; background:linear-gradient(90deg,#4f46e5,#a78bfa); border-radius:4px; }
    .user-badge {
      display:flex; align-items:center; gap:10px;
      background:rgba(255,255,255,0.05); padding:6px 16px 6px 12px; border-radius:40px;
      border:1px solid rgba(255,255,255,0.06);
    }
    .user-badge .avatar {
      width:32px; height:32px; border-radius:50%;
      background:linear-gradient(135deg,#4f46e5,#7c3aed);
      display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:0.85rem; color:#fff;
    }
    .user-badge .role-tag {
      font-size:0.7rem; background:rgba(79,70,229,0.25); padding:2px 12px;
      border-radius:20px; color:#a78bfa; font-weight:600; text-transform:uppercase;
    }
    .hero { padding:80px 0 60px; text-align:center; animation:fadeUp 1s ease forwards; }
    .hero h1 { font-size:3.8rem; font-weight:800; line-height:1.1; max-width:800px; margin:0 auto 16px; }
    .hero h1 .gradient { background:linear-gradient(135deg,#a78bfa,#4f46e5,#7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .hero p { color:#a0a9c4; font-size:1.2rem; max-width:580px; margin:0 auto 36px; line-height:1.7; }
    .hero .btns { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }
    .hero .stats { display:flex; justify-content:center; gap:48px; margin-top:56px; }
    .hero .stats .stat { text-align:center; }
    .hero .stats .stat .num { font-size:2rem; font-weight:700; color:#e8edf5; }
    .hero .stats .stat .label { color:#a0a9c4; font-size:0.85rem; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    .toast-container { position:fixed; bottom:30px; right:30px; z-index:999; display:flex; flex-direction:column; gap:10px; }
    .toast {
      padding:14px 24px; border-radius:16px; background:rgba(20,24,36,0.95);
      backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.06);
      color:#e8edf5; font-size:0.9rem; font-weight:500;
      box-shadow:0 12px 40px rgba(0,0,0,0.5);
      animation: slideUp 0.4s ease forwards;
      display:flex; align-items:center; gap:12px; min-width:260px;
    }
    .toast.success { border-left:4px solid #22c55e; }
    .toast.error { border-left:4px solid #ef4444; }
    .toast.info { border-left:4px solid #4f46e5; }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(20px) scale(0.96); }
      to { opacity:1; transform:translateY(0) scale(1); }
    }
    @media (max-width:768px) {
      .hero h1 { font-size:2.4rem; }
      .hero .stats { gap:24px; flex-wrap:wrap; }
      .nav-links { gap:14px; font-size:0.85rem; }
    }
    @media (max-width:480px) {
      .navbar .container { flex-wrap:wrap; gap:12px; }
      .nav-links { order:3; width:100%; justify-content:center; gap:18px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><i class="fas fa-code"></i> KyuuCode</a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Beranda</a></li>
        <li><a href="home.html">Snippet</a></li>
        <li><a href="search.html">Cari</a></li>
        <li><a href="list.html">Kategori</a></li>
      </ul>
      <div class="flex" style="gap:16px;">
        <div class="user-badge" id="userBadge">
          <div class="avatar" id="userAvatar">U</div>
          <span style="font-weight:500;font-size:0.9rem;" id="userName">User</span>
          <span class="role-tag" id="userRole">user</span>
        </div>
        <button class="btn-secondary" style="padding:6px 16px;font-size:0.8rem;" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </nav>

  <main style="flex:1;padding:40px 0 60px;">
    <div class="container">
      <div class="hero">
        <h1>Kelola <span class="gradient">Snippet Code</span><br />dengan Elegan</h1>
        <p>KyuuCode adalah tempat untuk menyimpan, mencari, dan berbagi potongan kode favorit Anda. Didesain untuk developer modern.</p>
        <div class="btns">
          <a href="home.html" class="btn-primary"><i class="fas fa-folder-open"></i> Buka Snippet</a>
          <a href="#" class="btn-secondary" onclick="showToast('Dokumentasi sedang disiapkan 📚','info')"><i class="fas fa-book"></i> Docs</a>
        </div>
        <div class="stats">
          <div class="stat"><div class="num" id="totalSnippets">0</div><div class="label">Total Snippet</div></div>
          <div class="stat"><div class="num" id="userRoleStat">User</div><div class="label">Role Anda</div></div>
          <div class="stat"><div class="num"><i class="fas fa-code" style="color:#a78bfa;"></i></div><div class="label">KyuuCode v1.0</div></div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="auth.js"></script>
  <script>
    (async () => {
      const session = await supabase.auth.getSession();
      if (!session.data.session) {
        window.location.href = 'auth.html';
        return;
      }
      currentUser = session.data.session.user;
      await loadProfile(currentUser.id);
      // Tampilkan user info
      if (currentProfile) {
        document.getElementById('userAvatar').textContent = currentProfile.username?.charAt(0) || 'U';
        document.getElementById('userName').textContent = currentProfile.username || 'User';
        document.getElementById('userRole').textContent = currentProfile.role || 'user';
        document.getElementById('userRoleStat').textContent = currentProfile.role === 'admin' ? 'Admin' : 'User';
      }
      // Load total snippets
      const snippets = await loadSnippets();
      document.getElementById('totalSnippets').textContent = snippets.length;
    })();
  </script>
</body>
</html>
